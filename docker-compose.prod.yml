version: '3.8'

# 方案 A 生产覆盖：仅 PostgreSQL + Redis + 后端，全部不对公网暴露端口
# 用法：docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d <service>

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在项目根 .env 中设置 POSTGRES_PASSWORD}
    ports: []                    # 抹掉基座文件的 0.0.0.0:5432 暴露

  redis:
    ports: []                    # 抹掉基座文件的 0.0.0.0:6379 暴露
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:?请在项目根 .env 中设置 REDIS_PASSWORD}"

  # 方案 A：以下服务显式禁用（使用 --profile milvus-full 才会启动）
  etcd:
    profiles: ["milvus-full"]
  minio:
    profiles: ["milvus-full"]
  milvus:
    profiles: ["milvus-full"]
  elasticsearch:
    profiles: ["milvus-full"]

  backend:
    build: ./backend
    container_name: industry_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: postgres    # 容器互访走服务名
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MEM_LIMIT: "1073741824"    # 2G 机器上沙箱内存上限降为 1G
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"    # 仅本机，供 Nginx 反代
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:8000/docs', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
